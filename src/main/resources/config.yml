# DeathAndTaxes works using the Vault economy API, this defines which implementation to use
economy:
  # If true, the plugin will attempt to use the default economy provider registered with Vault. (the highest priority provider)
  default: true
  # If default economy is false, you can specify specific names of economy implementations to use.
  # This is useful if you have multiple Vault economy implementations and want to specify which one(s) DeathAndTaxes should use. (if the highest priority provider is not the one you want)
  # This is also the only way to support multiple economy implementations at the same time.
  economies: []

# Defines how the death tax is calculated.
tax:
  # Available values: PERCENTAGE, FIXED
  mode: PERCENTAGE
  # When mode is PERCENTAGE the value is treated as the percentage of the player's balance to remove.
  # When mode is FIXED the value is treated as a flat amount to remove.
  value: 10.0
  # Minimum balance that should remain after the tax is applied.
  minimum-balance: 0.0
  # Enable to deposit every successfully collected tax into the configured Vault account.
  # When disabled, taxes are removed as before. Enabling requires a non-blank account name.
  # If depositing into this account fails, choose whether the original tax is refunded to the player.
  account:
    enabled: false
    name: ""
    refund-on-failure: true
  # Which discount permission percentages should be recognized.
  # Example: if 10 is listed here, players with deathandtaxes.discount.10 get 10% off the final tax.
  # The highest configured permission the player has will be used.
  discounts:
    - 10
    - 25
    - 50
    - 100
  # What world(s) the tax should be applied in.
  worlds:
    - world
    - world_nether
    - world_the_end
  # If the worlds list should be a blacklist instead of a whitelist. (if true, the tax will be applied in all worlds except those listed in worlds)
  blacklist-worlds: false

# Controls how currency amounts are displayed to players.
display:
  decimal-places: 2

# Gives each player this many tax-free deaths. Set to 0 to disable.
# Usage is stored on the player and persists across restarts and configuration reloads.
grace-deaths:
  count: 1

# Records each successfully collected death tax with its timestamp, player, and amount.
# death-taxes.log is written in the DeathAndTaxes plugin directory when file is enabled.
logging:
  console: true
  file: true

messages:
  # Player-facing message written in MiniMessage format. Use <amount> as the placeholder.
  # If you have multiple economies configured, use <amount_economyname> with the economy name lowercased and non [a-z0-9_-] characters replaced with _.
  death: |-
    <gray>
    <#f38ba8>You lost $<amount> as you died.</#f38ba8>
    <gray>
  # Sent instead of charging a player for a grace death.
  # Supports the same amount placeholders as messages.death, plus <remaining> and <grace_deaths>.
  grace-death: |-
    <gray>
    <#f9e2af>This death was tax-free. Future deaths could cost you $<amount>.</#f9e2af>
    <gray>
  # Sent when a configured death tax discount permission reduced the final tax. Use <discount> as the placeholder.
  discount: "<#a6e3a1>Your death tax discount saved you <discount>%.</#a6e3a1>"
